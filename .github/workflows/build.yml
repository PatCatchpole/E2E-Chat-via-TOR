# Builds the one-file Spectre executable for each platform.
#
# PyInstaller cannot cross-compile, so every platform is built on its own
# runner. Each run uploads the executables as workflow artifacts; pushing a tag
# such as v1.0.0 also attaches them to a GitHub release.
name: build

on:
  push:
    branches: [harden-protocol, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write     # only used by the release step, on tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # binary: what the smoke test runs. package: what gets uploaded.
          - os: windows-latest
            artifact: Spectre-windows-x86_64.exe
            binary: dist/Spectre.exe
            package: dist/Spectre.exe
          - os: macos-latest
            artifact: Spectre-macos-arm64.zip
            binary: dist/Spectre.app/Contents/MacOS/Spectre
            package: dist/Spectre.app.zip
          # The oldest supported Ubuntu, so the binary runs on older glibc too.
          # Terminal interface only; see packaging/spectre.spec.
          - os: ubuntu-22.04
            artifact: Spectre-linux-x86_64
            binary: dist/Spectre
            package: dist/Spectre
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt pytest==8.4.2

      - name: Test
        run: python -m pytest tests/ -q

      - name: Build
        run: python packaging/build.py

      # The frozen relay and backend are only reachable through `--serve`, and
      # a missing hidden import shows up nowhere else until somebody hosts.
      - name: Smoke test
        env:
          SPECTRE_INTERNAL_TOKEN: smoke-test-token
          SPECTRE_BACKEND_PORT: "18090"
          SPECTRE_BACKEND_URL: http://127.0.0.1:18090
          SPECTRE_RELAY_HOST: 127.0.0.1
          SPECTRE_RELAY_PORT: "15055"
          SPECTRE_ALLOW_DEV_SERVER: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          "${{ matrix.binary }}" --serve backend > backend.log 2>&1 &
          "${{ matrix.binary }}" --serve relay < /dev/null > relay.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:15055/healthz \
               && curl -sf -X POST -H "X-Internal-Token: $SPECTRE_INTERNAL_TOKEN" \
                       -H "Content-Type: application/json" -d '{"room":"r","user":"u"}' \
                       http://127.0.0.1:18090/internal/rooms/join; then
              echo; echo "relay and backend answered"; exit 0
            fi
            sleep 1
          done
          echo "--- backend.log"; cat backend.log
          echo "--- relay.log"; cat relay.log
          exit 1

      - name: Rename
        run: mv "${{ matrix.package }}" "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
